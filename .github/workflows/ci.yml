name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Normal CI is networkless with respect to providers and never receives a
      # live key or a permissive fake-success configuration.
      OPENAI_API_KEY: ""
      DEVICE_TOKENS_JSON: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Required offline checks
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
