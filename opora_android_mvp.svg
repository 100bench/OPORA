<svg xmlns="http://www.w3.org/2000/svg" width="3040" height="1120" viewBox="0 0 3040 1120">
  <style>
    .canvas{fill:#E9EFEC}.device{fill:#111A17}.screen{fill:#F8FBF9}.surface{fill:#FFFFFF}.subtle{fill:#F0F6F3}.primary{fill:#0B6B58}.primarySoft{fill:#D9F2E9}.text{fill:#15211E}.muted{fill:#52615C}.border{stroke:#DDE8E3}.warning{fill:#7A5000}.warningSoft{fill:#FFF1C7}.danger{fill:#982F2B}.dangerSoft{fill:#FFE3E0}.success{fill:#246B43}.successSoft{fill:#DDF3E5}.white{fill:#FFFFFF}.blue{fill:#246BCE}.blueSoft{fill:#E5EEFF}
    text{font-family:Roboto,Arial,sans-serif}.label{font-size:18px;font-weight:600}.title{font-size:28px;font-weight:700}.subtitle{font-size:22px;font-weight:600}.body{font-size:18px;font-weight:400}.small{font-size:14px;font-weight:500}.tiny{font-size:12px;font-weight:500}.button{font-size:18px;font-weight:600}.screenLabel{font-size:20px;font-weight:700;fill:#15211E}.flow{stroke:#8FA49B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect id="Canvas background" class="canvas" width="3040" height="1120"/>
  <text id="Flow title" x="40" y="48" class="title text">Опора · Android MVP · Основной сценарий</text>
  <text x="40" y="76" class="body muted">Рабочее название · крупные зоны касания · подтверждение важных действий · безопасный отказ</text>

  <g id="01 Home" transform="translate(40 0)">
    <text x="0" y="116" class="screenLabel">01 · Главная</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/>
    <rect id="Home screen" class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:41</text>
    <path d="M340 169h18M342 174h14M345 179h8" stroke="#15211E" stroke-width="2" stroke-linecap="round"/>
    <rect x="366" y="168" width="22" height="12" rx="3" fill="none" stroke="#15211E" stroke-width="2"/><rect x="369" y="171" width="14" height="6" rx="1" class="text"/>
    <g id="Home header">
      <circle cx="46" cy="220" r="22" class="primary"/>
      <path d="M40 218v-4a6 6 0 0 1 12 0v4a6 6 0 0 1-12 0Zm-5 0a11 11 0 0 0 22 0M46 229v7" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="80" y="228" class="subtitle text">Опора</text>
      <rect x="292" y="202" width="84" height="34" rx="17" class="successSoft"/>
      <circle cx="310" cy="219" r="5" class="success"/><text x="322" y="224" class="tiny success">Готова</text>
    </g>
    <text x="28" y="290" class="title text">Здравствуйте, Анна</text>
    <text x="28" y="322" class="body muted">Я рядом. Просто скажите,</text><text x="28" y="348" class="body muted">что нужно сделать.</text>
    <g id="Primary voice action">
      <circle cx="206" cy="470" r="88" class="primarySoft"/>
      <circle cx="206" cy="470" r="66" class="primary"/>
      <rect x="191" y="428" width="30" height="50" rx="15" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M181 466c0 16 11 27 25 27s25-11 25-27M206 493v18M190 511h32" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="123" y="584" class="label text">Нажмите и говорите</text>
    </g>
    <text x="28" y="638" class="subtitle text">Быстрые действия</text>
    <g id="Quick actions">
      <rect x="28" y="660" width="356" height="72" rx="18" class="surface border" stroke-width="2"/>
      <circle cx="64" cy="696" r="22" class="primarySoft"/><path d="M56 685c3 14 10 21 24 24l5-7-8-6-5 4c-5-2-8-5-10-10l4-5-6-8-4 8Z" class="primary"/>
      <text x="98" y="703" class="body text">Позвонить близкому</text><path d="m352 688 8 8-8 8" class="flow"/>
      <rect x="28" y="744" width="356" height="72" rx="18" class="surface border" stroke-width="2"/>
      <circle cx="64" cy="780" r="22" class="blueSoft"/><path d="M54 790h20M57 786v-13h14v13M54 774l10-8 10 8" stroke="#246BCE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="787" class="body text">Открыть Госуслуги</text><path d="m352 772 8 8-8 8" class="flow"/>
      <rect x="28" y="828" width="356" height="72" rx="18" class="surface border" stroke-width="2"/>
      <circle cx="64" cy="864" r="22" class="warningSoft"/><path d="M64 853v13M64 873h.1" stroke="#7A5000" stroke-width="3" stroke-linecap="round"/><circle cx="64" cy="864" r="13" fill="none" stroke="#7A5000" stroke-width="2"/>
      <text x="98" y="871" class="body text">Объяснить экран</text><path d="m352 856 8 8-8 8" class="flow"/>
    </g>
    <rect x="28" y="928" width="356" height="62" rx="16" class="subtle"/><path d="M50 950v-5a8 8 0 0 1 16 0v5M47 950h22v22H47z" fill="none" stroke="#52615C" stroke-width="2"/><text x="82" y="953" class="small muted">Экран не записывается</text><text x="82" y="974" class="small muted">постоянно</text>
    <rect x="166" y="1028" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>

  <path d="M468 590h48m-12-12 12 12-12 12" class="flow"/>

  <g id="02 Listening" transform="translate(540 0)">
    <text x="0" y="116" class="screenLabel">02 · Слушаю</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/><rect class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:42</text><text x="28" y="232" class="small muted">Опора</text>
    <text x="28" y="278" class="title text">Слушаю вас</text><text x="28" y="310" class="body muted">Говорите как обычно, без команд.</text>
    <g id="Waveform">
      <rect x="44" y="390" width="12" height="56" rx="6" class="primary" opacity=".45"/><rect x="68" y="370" width="12" height="96" rx="6" class="primary" opacity=".65"/><rect x="92" y="344" width="12" height="148" rx="6" class="primary"/><rect x="116" y="382" width="12" height="72" rx="6" class="primary" opacity=".75"/><rect x="140" y="356" width="12" height="124" rx="6" class="primary"/><rect x="164" y="328" width="12" height="180" rx="6" class="primary"/><rect x="188" y="370" width="12" height="96" rx="6" class="primary" opacity=".8"/><rect x="212" y="346" width="12" height="144" rx="6" class="primary"/><rect x="236" y="378" width="12" height="80" rx="6" class="primary" opacity=".7"/><rect x="260" y="350" width="12" height="136" rx="6" class="primary"/><rect x="284" y="374" width="12" height="88" rx="6" class="primary" opacity=".65"/><rect x="308" y="392" width="12" height="52" rx="6" class="primary" opacity=".45"/><rect x="332" y="402" width="12" height="32" rx="6" class="primary" opacity=".35"/>
    </g>
    <rect x="28" y="548" width="356" height="144" rx="24" class="surface border" stroke-width="2"/>
    <text x="52" y="584" class="small muted">Я услышала:</text><text x="52" y="630" class="subtitle text">«Открой Госуслуги»</text><text x="52" y="662" class="small success">Понимаю просьбу</text>
    <rect x="28" y="726" width="356" height="64" rx="22" class="primary"/><text x="136" y="767" class="button white">Готово, выполнить</text>
    <rect x="28" y="806" width="356" height="64" rx="22" class="surface border" stroke-width="2"/><text x="176" y="847" class="button text">Отмена</text>
    <rect x="28" y="912" width="356" height="70" rx="18" class="primarySoft"/><path d="M54 939v-5a8 8 0 0 1 16 0v5M51 939h22v22H51z" fill="none" stroke="#0B6B58" stroke-width="2"/><text x="88" y="940" class="small primary">Выполню только безопасный</text><text x="88" y="961" class="small primary">переход в приложение</text>
    <rect x="166" y="1028" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>

  <path d="M968 590h48m-12-12 12 12-12 12" class="flow"/>

  <g id="03 Guidance overlay" transform="translate(1040 0)">
    <text x="0" y="116" class="screenLabel">03 · Подсказка поверх приложения</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/><rect class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:43</text>
    <g id="Gosuslugi app">
      <rect x="8" y="194" width="396" height="112" class="blue"/><text x="28" y="242" class="subtitle white">Госуслуги</text><text x="28" y="274" class="small white">Вход в личный кабинет</text>
      <text x="28" y="356" class="title text">Войти</text><text x="28" y="394" class="small muted">Телефон, почта или СНИЛС</text>
      <rect x="28" y="410" width="356" height="60" rx="12" class="surface border" stroke-width="2"/><text x="48" y="447" class="body muted">+7 900 123-45-67</text>
      <rect x="28" y="494" width="356" height="62" rx="14" class="blue"/><text x="182" y="534" class="button white">Войти</text>
      <text x="28" y="598" class="body text">Не получается войти?</text><text x="28" y="630" class="small blue">Восстановить доступ</text>
    </g>
    <rect x="8" y="306" width="396" height="488" fill="#15211E" opacity=".14"/>
    <rect x="20" y="486" width="372" height="78" rx="18" fill="none" stroke="#0B6B58" stroke-width="5"/>
    <path d="M340 606c-8-22-8-34 10-45" stroke="#0B6B58" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m340 560 12-1-2 12" fill="none" stroke="#0B6B58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="Assistant bottom sheet">
      <rect x="8" y="694" width="396" height="358" rx="32" class="surface"/><rect x="166" y="708" width="80" height="6" rx="3" fill="#C5D2CC"/>
      <rect x="28" y="744" width="92" height="30" rx="15" class="primarySoft"/><text x="44" y="764" class="tiny primary">Шаг 1 из 3</text>
      <text x="28" y="820" class="subtitle text">Нажмите синюю кнопку</text><text x="28" y="850" class="subtitle text">«Войти»</text>
      <text x="28" y="884" class="body muted">Я подсветила её на экране.</text>
      <rect x="28" y="916" width="170" height="62" rx="20" class="surface border" stroke-width="2"/><text x="48" y="955" class="button text">Показать ещё</text>
      <rect x="210" y="916" width="174" height="62" rx="20" class="primary"/><text x="230" y="955" class="button white">Нажать за меня</text>
      <text x="28" y="1016" class="tiny muted">Только навигация · без паролей и кодов</text>
    </g>
    <rect x="166" y="1032" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>

  <path d="M1468 590h48m-12-12 12 12-12 12" class="flow"/>

  <g id="04 Call confirmation" transform="translate(1540 0)">
    <text x="0" y="116" class="screenLabel">04 · Подтверждение звонка</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/><rect class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:45</text>
    <path d="m34 226 10-10m-10 10 10 10" class="flow"/><text x="64" y="234" class="subtitle text">Подтверждение</text>
    <rect x="28" y="276" width="356" height="410" rx="28" class="surface border" stroke-width="2"/>
    <circle cx="206" cy="378" r="62" class="primarySoft"/><text x="184" y="396" style="font-size:52px;font-weight:700" class="primary">А</text>
    <text x="144" y="476" class="title text">Анна</text><text x="151" y="508" class="body muted">Внучка</text><text x="128" y="546" class="body text">+7 921 555-12-34</text>
    <rect x="86" y="580" width="240" height="42" rx="21" class="warningSoft"/><circle cx="108" cy="601" r="8" class="warning"/><text x="124" y="607" class="small warning">Требуется подтверждение</text>
    <text x="28" y="742" class="title text">Позвонить Анне?</text><text x="28" y="780" class="body muted">Я не начну звонок без вашего</text><text x="28" y="806" class="body muted">нажатия на кнопку.</text>
    <rect x="28" y="842" width="356" height="72" rx="24" class="primary"/><path d="M78 862c3 14 10 21 24 24l5-7-8-6-5 4c-5-2-8-5-10-10l4-5-6-8-4 8Z" fill="#fff"/><text x="142" y="887" class="button white">Позвонить</text>
    <rect x="28" y="930" width="356" height="64" rx="22" class="surface border" stroke-width="2"/><text x="176" y="971" class="button text">Отмена</text>
    <rect x="166" y="1028" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>

  <path d="M1968 590h48m-12-12 12 12-12 12" class="flow"/>

  <g id="05 Scam warning" transform="translate(2040 0)">
    <text x="0" y="116" class="screenLabel">05 · Предупреждение о мошенничестве</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/><rect class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:47</text><text x="28" y="232" class="subtitle text">Сообщения</text>
    <rect x="62" y="276" width="322" height="162" rx="24" class="blueSoft"/><text x="84" y="314" class="body text">Вам одобрена компенсация</text><text x="84" y="342" class="body text">18 500 ₽. Получите сегодня:</text><text x="84" y="380" class="small blue">gos-vyplata.help/bonus</text><text x="326" y="416" class="tiny muted">09:46</text>
    <g id="Fraud alert">
      <rect x="20" y="478" width="372" height="452" rx="30" class="surface" stroke="#F0B7B2" stroke-width="3"/>
      <circle cx="60" cy="530" r="24" class="dangerSoft"/><path d="M60 516v18M60 542h.1" stroke="#982F2B" stroke-width="4" stroke-linecap="round"/>
      <text x="98" y="526" class="subtitle danger">Похоже на</text><text x="98" y="555" class="subtitle danger">мошенничество</text>
      <text x="44" y="604" class="body text">Почему я так думаю:</text>
      <circle cx="52" cy="642" r="5" class="danger"/><text x="70" y="648" class="body muted">Обещают неожиданные деньги</text>
      <circle cx="52" cy="682" r="5" class="danger"/><text x="70" y="688" class="body muted">Просят перейти по незнакомой ссылке</text>
      <circle cx="52" cy="722" r="5" class="danger"/><text x="70" y="728" class="body muted">Торопят сделать это сегодня</text>
      <rect x="44" y="772" width="324" height="64" rx="22" class="danger"/><text x="140" y="813" class="button white">Не открывать</text>
      <rect x="44" y="850" width="324" height="58" rx="20" class="surface" stroke="#982F2B" stroke-width="2"/><text x="112" y="888" class="button danger">Позвонить близкому</text>
    </g>
    <text x="28" y="976" class="small muted">Решение всегда остаётся за вами</text>
    <rect x="166" y="1028" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>

  <path d="M2468 590h48m-12-12 12 12-12 12" class="flow"/>

  <g id="06 Payment boundary" transform="translate(2540 0)">
    <text x="0" y="116" class="screenLabel">06 · Платёж: граница безопасности</text>
    <rect class="device" x="0" y="140" width="412" height="920" rx="46"/><rect class="screen" x="8" y="148" width="396" height="904" rx="38"/>
    <text x="34" y="180" class="tiny text">09:49</text>
    <text x="28" y="232" class="subtitle text">Оплата услуг</text>
    <rect x="28" y="270" width="356" height="190" rx="24" class="surface border" stroke-width="2"/>
    <text x="52" y="310" class="small muted">Получатель</text><text x="52" y="344" class="body text">ООО «Город-Сервис»</text><text x="52" y="390" class="small muted">Сумма</text><text x="52" y="430" class="title text">18 500 ₽</text>
    <text x="28" y="510" class="body text">Код из сообщения банка</text>
    <g id="OTP fields"><rect x="28" y="532" width="64" height="70" rx="16" class="surface border" stroke-width="2"/><rect x="104" y="532" width="64" height="70" rx="16" class="surface border" stroke-width="2"/><rect x="180" y="532" width="64" height="70" rx="16" class="surface border" stroke-width="2"/><rect x="256" y="532" width="64" height="70" rx="16" class="surface border" stroke-width="2"/></g>
    <rect x="8" y="620" width="396" height="432" rx="32" class="surface"/><rect x="166" y="636" width="80" height="6" rx="3" fill="#C5D2CC"/>
    <rect x="28" y="674" width="146" height="34" rx="17" class="dangerSoft"/><circle cx="48" cy="691" r="6" class="danger"/><text x="62" y="697" class="tiny danger">Высокий риск</text>
    <text x="28" y="752" class="subtitle danger">Я не ввожу коды</text><text x="28" y="782" class="subtitle danger">и не подтверждаю платежи</text>
    <text x="28" y="824" class="body muted">Так я защищаю ваши деньги.</text><text x="28" y="850" class="body muted">Вы можете продолжить сами.</text>
    <rect x="28" y="884" width="356" height="64" rx="22" class="primary"/><text x="122" y="925" class="button white">Позвать близкого</text>
    <rect x="28" y="960" width="356" height="58" rx="20" class="surface border" stroke-width="2"/><text x="122" y="998" class="button text">Я продолжу сам</text>
    <rect x="166" y="1032" width="80" height="5" rx="3" class="text" opacity=".7"/>
  </g>
</svg>
