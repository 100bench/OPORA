<svg xmlns="http://www.w3.org/2000/svg" width="2440" height="1120" viewBox="0 0 2440 1120">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDEBE6"/>
      <stop offset="1" stop-color="#BFD7CF"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F2FF"/>
      <stop offset="1" stop-color="#C9DCF8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10201B" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#10201B" flood-opacity=".22"/>
    </filter>
    <style>
      text{font-family:Roboto,Arial,sans-serif}.canvas{fill:#E9EFEC}.device{fill:#111A17}.screen{fill:#F8FBF9}.surface{fill:#FFFFFF}.subtle{fill:#F0F6F3}.primary{fill:#0B6B58}.primary2{fill:#12836C}.primarySoft{fill:#D9F2E9}.text{fill:#15211E}.muted{fill:#52615C}.border{stroke:#DDE8E3}.white{fill:#FFFFFF}.blue{fill:#246BCE}.blueSoft{fill:#E5EEFF}.danger{fill:#982F2B}.dangerSoft{fill:#FFE3E0}.warning{fill:#7A5000}.warningSoft{fill:#FFF1C7}
      .h1{font-size:34px;font-weight:700}.title{font-size:27px;font-weight:700}.subtitle{font-size:21px;font-weight:600}.body{font-size:18px;font-weight:400}.label{font-size:17px;font-weight:600}.small{font-size:14px;font-weight:500}.tiny{font-size:12px;font-weight:500}.screenLabel{font-size:20px;font-weight:700;fill:#15211E}.flow{stroke:#8FA49B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect id="Canvas background" class="canvas" width="2440" height="1120"/>
  <text id="Flow title" x="44" y="54" class="h1 text">Опора поверх Android · самый лёгкий сценарий</text>
  <text x="44" y="88" class="body muted">Дружелюбный помощник у края экрана: одно нажатие → говорить или написать → подсказка остаётся поверх приложения</text>

  <g id="01 Collapsed assistant" transform="translate(44 0)">
    <text x="0" y="132" class="screenLabel">01 · Всегда рядом</text>
    <rect class="device" x="0" y="154" width="390" height="858" rx="48"/>
    <rect id="Android home screen" x="8" y="162" width="374" height="842" rx="40" fill="url(#wall)"/>
    <text x="30" y="198" class="tiny text">09:41</text>
    <path d="M316 187h18M318 192h14M321 197h8" stroke="#15211E" stroke-width="2" stroke-linecap="round"/>
    <rect x="344" y="186" width="22" height="12" rx="3" fill="none" stroke="#15211E" stroke-width="2"/><rect x="347" y="189" width="14" height="6" rx="1" class="text"/>
    <text x="30" y="294" style="font-size:58px;font-weight:300" class="text">09:41</text>
    <text x="32" y="326" class="body muted">Среда, 25 сентября · +12°</text>
    <g id="Home apps">
      <g transform="translate(34 404)"><rect width="64" height="64" rx="18" fill="#FFFFFF" opacity=".94"/><path d="M20 19c3 16 11 24 27 27l6-8-9-7-6 5c-6-2-10-6-12-12l5-6-7-9-4 10Z" class="primary"/><text x="4" y="88" class="small text">Телефон</text></g>
      <g transform="translate(121 404)"><rect width="64" height="64" rx="18" fill="#FFFFFF" opacity=".94"/><circle cx="32" cy="30" r="18" fill="#48A868"/><path d="M20 48l4-9" stroke="#48A868" stroke-width="6"/><path d="M24 21h16v18H24z" fill="#fff" opacity=".9"/><text x="2" y="88" class="small text">Сообщения</text></g>
      <g transform="translate(208 404)"><rect width="64" height="64" rx="18" fill="#FFFFFF" opacity=".94"/><circle cx="32" cy="31" r="20" class="blueSoft"/><path d="M19 42 30 28l7 9 5-6 8 11Z" class="blue"/><circle cx="23" cy="22" r="4" class="blue"/><text x="7" y="88" class="small text">Фото</text></g>
      <g transform="translate(295 404)"><rect width="64" height="64" rx="18" fill="#246BCE"/><path d="M18 45h28M22 41V25h20v16M18 26l14-11 14 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="-3" y="88" class="small text">Госуслуги</text></g>
    </g>
    <g id="Dock" transform="translate(28 886)"><rect width="334" height="82" rx="30" fill="#FFFFFF" opacity=".78"/><circle cx="52" cy="41" r="23" class="primarySoft"/><path d="M43 34c2 11 7 16 18 18l4-6-6-4-4 3c-4-2-6-4-8-8l3-4-5-6-2 7Z" class="primary"/><circle cx="126" cy="41" r="23" class="blueSoft"/><circle cx="200" cy="41" r="23" fill="#FFF1C7"/><circle cx="274" cy="41" r="23" fill="#EADFF8"/></g>

    <g id="Opora edge button" filter="url(#smallShadow)">
      <rect x="248" y="584" width="142" height="70" rx="35" class="surface"/>
      <circle cx="283" cy="619" r="29" class="primary"/>
      <circle cx="273" cy="614" r="3.2" class="white"/><circle cx="292" cy="614" r="3.2" class="white"/>
      <path d="M273 627c7 6 14 6 20 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="320" y="616" class="small primary">Опора</text><text x="320" y="635" class="tiny muted">Помощь</text>
    </g>
    <rect x="83" y="1036" width="224" height="34" rx="17" class="primarySoft"/><text x="105" y="1058" class="tiny primary">Не двигается и не мешает</text>
  </g>

  <path d="M452 600h46m-12-12 12 12-12 12" class="flow"/>

  <g id="02 Assistant menu" transform="translate(516 0)">
    <text x="0" y="132" class="screenLabel">02 · Нажали один раз</text>
    <rect class="device" x="0" y="154" width="390" height="858" rx="48"/>
    <rect x="8" y="162" width="374" height="842" rx="40" fill="url(#wall)"/>
    <text x="30" y="198" class="tiny text">09:41</text><text x="30" y="294" style="font-size:58px;font-weight:300" class="text">09:41</text><text x="32" y="326" class="body muted">Среда, 25 сентября · +12°</text>
    <rect x="8" y="162" width="374" height="842" rx="40" fill="#15211E" opacity=".16"/>
    <g id="Expanded assistant sheet" filter="url(#shadow)">
      <rect x="8" y="554" width="374" height="450" rx="36" class="surface"/>
      <rect x="155" y="570" width="80" height="6" rx="3" fill="#C7D3CE"/>
      <circle cx="58" cy="632" r="30" class="primary"/>
      <circle cx="48" cy="627" r="3.2" class="white"/><circle cx="67" cy="627" r="3.2" class="white"/><path d="M48 640c7 6 14 6 20 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="104" y="625" class="title text">Я рядом</text><text x="104" y="653" class="small muted">Как вам удобнее?</text>
      <g id="Talk button"><rect x="28" y="696" width="334" height="82" rx="25" class="primary"/><rect x="57" y="716" width="22" height="34" rx="11" fill="none" stroke="#fff" stroke-width="3"/><path d="M51 742c0 10 7 17 17 17s17-7 17-17M68 759v8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="113" y="747" class="subtitle white">Говорить</text><text x="113" y="768" class="tiny white" opacity=".86">Нажмите и скажите просьбу</text></g>
      <g id="Type button"><rect x="28" y="794" width="334" height="72" rx="23" class="surface border" stroke-width="2"/><path d="M52 814h36v27H62l-10 8Z" fill="none" stroke="#0B6B58" stroke-width="3" stroke-linejoin="round"/><text x="113" y="838" class="subtitle text">Написать</text><text x="113" y="858" class="tiny muted">Откроется крупная клавиатура</text></g>
      <g id="Explain shortcut"><rect x="28" y="882" width="334" height="64" rx="21" class="primarySoft"/><circle cx="66" cy="914" r="18" class="surface"/><path d="M66 904v12M66 923h.1" stroke="#0B6B58" stroke-width="3" stroke-linecap="round"/><text x="102" y="920" class="label primary">Что сейчас на экране?</text></g>
      <text x="28" y="978" class="tiny muted">Смахните вниз или скажите «закройся»</text>
    </g>
    <rect x="83" y="1036" width="224" height="34" rx="17" class="primarySoft"/><text x="110" y="1058" class="tiny primary">Два понятных действия</text>
  </g>

  <path d="M924 600h46m-12-12 12 12-12 12" class="flow"/>

  <g id="03 Listening overlay" transform="translate(988 0)">
    <text x="0" y="132" class="screenLabel">03 · Разговор поверх экрана</text>
    <rect class="device" x="0" y="154" width="390" height="858" rx="48"/>
    <rect x="8" y="162" width="374" height="842" rx="40" fill="url(#wall2)"/>
    <text x="30" y="198" class="tiny text">09:42</text>
    <g opacity=".96"><rect x="30" y="240" width="330" height="84" rx="20" class="surface"/><circle cx="72" cy="282" r="24" class="blueSoft"/><path d="M58 294 70 278l8 10 6-7 9 13Z" class="blue"/><text x="112" y="277" class="label text">Фотографии</text><text x="112" y="300" class="small muted">Последние снимки</text></g>
    <g opacity=".96"><rect x="30" y="342" width="330" height="84" rx="20" class="surface"/><circle cx="72" cy="384" r="24" class="primarySoft"/><path d="M62 373c2 11 7 16 18 18l4-6-6-4-4 3c-4-2-6-4-8-8l3-4-5-6-2 7Z" class="primary"/><text x="112" y="379" class="label text">Контакты</text><text x="112" y="402" class="small muted">Семья и близкие</text></g>
    <g id="Listening pill" filter="url(#shadow)">
      <rect x="34" y="535" width="322" height="114" rx="32" class="surface"/>
      <circle cx="90" cy="592" r="34" class="primary"/>
      <rect x="82" y="570" width="16" height="27" rx="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M76 591c0 9 6 15 14 15s14-6 14-15M90 606v8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="140" y="580" class="subtitle text">Слушаю вас</text>
      <g transform="translate(141 598)"><rect x="0" y="5" width="6" height="16" rx="3" class="primary" opacity=".5"/><rect x="13" y="0" width="6" height="26" rx="3" class="primary"/><rect x="26" y="7" width="6" height="12" rx="3" class="primary" opacity=".65"/><rect x="39" y="2" width="6" height="22" rx="3" class="primary"/><rect x="52" y="6" width="6" height="14" rx="3" class="primary" opacity=".55"/></g>
      <rect x="280" y="564" width="50" height="50" rx="18" class="dangerSoft"/><rect x="299" y="583" width="12" height="12" rx="2" class="danger"/>
    </g>
    <g id="Live transcript"><rect x="34" y="674" width="322" height="150" rx="28" class="surface border" stroke-width="2"/><text x="58" y="710" class="small muted">Я услышала:</text><text x="58" y="754" class="subtitle text">«Позвони Анне»</text><text x="58" y="788" class="small primary">Сначала покажу подтверждение</text></g>
    <rect x="34" y="846" width="322" height="78" rx="24" class="primarySoft"/><path d="M58 872v-5a8 8 0 0 1 16 0v5M55 872h22v22H55z" fill="none" stroke="#0B6B58" stroke-width="2"/><text x="94" y="877" class="small primary">Микрофон включён только</text><text x="94" y="898" class="small primary">во время разговора</text>
    <rect x="83" y="1036" width="224" height="34" rx="17" class="primarySoft"/><text x="108" y="1058" class="tiny primary">Приложение остаётся видно</text>
  </g>

  <path d="M1396 600h46m-12-12 12 12-12 12" class="flow"/>

  <g id="04 Guidance with bubble" transform="translate(1460 0)">
    <text x="0" y="132" class="screenLabel">04 · Помощь в другом приложении</text>
    <rect class="device" x="0" y="154" width="390" height="858" rx="48"/>
    <rect x="8" y="162" width="374" height="842" rx="40" class="screen"/>
    <text x="30" y="198" class="tiny text">09:44</text>
    <rect x="8" y="214" width="374" height="106" class="blue"/><text x="28" y="258" class="subtitle white">Госуслуги</text><text x="28" y="286" class="small white">Вход в личный кабинет</text>
    <text x="28" y="376" class="title text">Войти</text><text x="28" y="414" class="small muted">Телефон, почта или СНИЛС</text>
    <rect x="28" y="434" width="334" height="62" rx="14" class="surface border" stroke-width="2"/><text x="48" y="472" class="body muted">+7 900 123-45-67</text>
    <rect x="28" y="528" width="334" height="66" rx="16" class="blue"/><text x="170" y="570" class="label white">Войти</text>
    <rect x="18" y="518" width="354" height="86" rx="22" fill="none" stroke="#0B6B58" stroke-width="5"/>
    <path d="M318 652c-8-22-8-34 10-45" stroke="#0B6B58" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m318 606 12-1-2 12" fill="none" stroke="#0B6B58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="Minimized bubble" filter="url(#smallShadow)"><circle cx="338" cy="390" r="32" class="primary"/><circle cx="327" cy="385" r="3.2" class="white"/><circle cx="347" cy="385" r="3.2" class="white"/><path d="M328 398c7 6 14 6 20 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <g id="Guidance sheet" filter="url(#shadow)"><rect x="8" y="672" width="374" height="332" rx="34" class="surface"/><rect x="155" y="688" width="80" height="6" rx="3" fill="#C7D3CE"/><rect x="28" y="724" width="94" height="30" rx="15" class="primarySoft"/><text x="44" y="744" class="tiny primary">Шаг 1 из 3</text><text x="28" y="806" class="subtitle text">Нажмите синюю кнопку</text><text x="28" y="836" class="subtitle text">«Войти»</text><text x="28" y="874" class="body muted">Я подсветила её на экране.</text><rect x="28" y="910" width="156" height="60" rx="21" class="surface border" stroke-width="2"/><text x="63" y="948" class="label text">Не понимаю</text><rect x="198" y="910" width="164" height="60" rx="21" class="primary"/><text x="242" y="948" class="label white">Понятно</text></g>
    <rect x="83" y="1036" width="224" height="34" rx="17" class="primarySoft"/><text x="112" y="1058" class="tiny primary">Можно свернуть в кружок</text>
  </g>

  <g id="Recommendation panel" transform="translate(1884 154)">
    <rect width="512" height="858" rx="38" class="surface" filter="url(#shadow)"/>
    <rect x="28" y="28" width="148" height="34" rx="17" class="primarySoft"/><text x="47" y="50" class="small primary">Моя рекомендация</text>
    <text x="28" y="112" class="title text">Не просто «питомец»,</text><text x="28" y="146" class="title text">а понятная помощь</text>
    <text x="28" y="188" class="body muted">Тёплый характер — да. Движение</text><text x="28" y="214" class="body muted">по экрану и скрытые жесты — нет.</text>

    <g id="Recommended option"><rect x="28" y="252" width="456" height="184" rx="26" class="primarySoft"/><circle cx="76" cy="302" r="28" class="primary"/><path d="m65 302 8 8 16-20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="296" class="subtitle primary">Плавающая кнопка</text><text x="122" y="324" class="small primary">Основной вариант MVP</text><text x="52" y="368" class="body text">• Всегда в одном месте</text><text x="52" y="398" class="body text">• Подписана словом «Помощь»</text></g>

    <g id="Home widget option"><rect x="28" y="456" width="456" height="144" rx="26" class="subtle border" stroke-width="2"/><circle cx="76" cy="504" r="27" class="blueSoft"/><path d="M61 516h30M65 512v-20h22v20M61 494l15-12 15 12" stroke="#246BCE" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="498" class="subtitle text">Виджет на главном</text><text x="122" y="526" class="small muted">Запасной вход в приложение</text><text x="52" y="566" class="small muted">Работает даже если плавающая кнопка выключена</text></g>

    <g id="Pet option"><rect x="28" y="620" width="456" height="140" rx="26" class="subtle border" stroke-width="2"/><circle cx="76" cy="668" r="27" fill="#F0E7FA"/><circle cx="68" cy="664" r="3" fill="#72558C"/><circle cx="84" cy="664" r="3" fill="#72558C"/><path d="M69 678c5 4 10 4 15 0" stroke="#72558C" stroke-width="3" fill="none" stroke-linecap="round"/><text x="122" y="660" class="subtitle text">Живой питомец</text><text x="122" y="688" class="small muted">Опциональная тема позже</text><text x="52" y="730" class="small muted">Без самовольного движения и всплывающих реплик</text></g>

    <rect x="28" y="788" width="456" height="44" rx="16" class="warningSoft"/><text x="50" y="816" class="small warning">Важно: отдельное разрешение «поверх приложений»</text>
  </g>
</svg>
